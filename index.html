<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#4f46e5">
<title>Pull-up Tracker</title>
<style>
  :root {
    --bg: #ffffff;
    --bg2: #f5f5f5;
    --text: #111111;
    --text2: #666666;
    --accent: #4f46e5;
    --accent-light: #e0e7ff;
    --danger: #ef4444;
    --success: #22c55e;
    --border: rgba(0,0,0,0.1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111111;
      --bg2: #1e1e1e;
      --text: #f0f0f0;
      --text2: #999999;
      --accent: #818cf8;
      --accent-light: #1e1b4b;
      --border: rgba(255,255,255,0.1);
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    overscroll-behavior-y: none;
  }
  #app {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 16px;
    gap: 16px;
    padding-bottom: 90px;
  }
  h1, h2, h3 { margin: 0; }
  p { margin: 0; color: var(--text2); }
  button {
    font-family: inherit;
    cursor: pointer;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 48px;
    padding: 12px 20px;
    border-radius: 12px;
    border: none;
    font-size: 17px;
    font-weight: 600;
    background: var(--accent);
    color: #fff;
    transition: opacity .15s ease;
  }
  .btn:active { opacity: .8; }
  .btn.btn-block { width: 100%; }
  .btn.btn-secondary {
    background: var(--bg2);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn.btn-danger { background: var(--danger); }
  .btn[disabled] { opacity: .5; cursor: default; }

  .card {
    background: var(--bg2);
    border-radius: 16px;
    padding: 16px;
    border: 1px solid var(--border);
  }
  .row { display: flex; gap: 12px; }
  .row > * { flex: 1; }
  .tile {
    background: var(--bg2);
    border-radius: 16px;
    padding: 16px;
    border: 1px solid var(--border);
  }
  .tile .value { font-size: 28px; font-weight: 700; }
  .tile .label { font-size: 13px; color: var(--text2); margin-top: 4px; }

  /* XP bar */
  .xp-block { display: flex; align-items: center; gap: 12px; }
  .level-badge {
    width: 52px; height: 52px; border-radius: 50%;
    background: var(--accent); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 18px;
    flex-shrink: 0;
  }
  .level-badge.pulse { animation: pulse 0.6s ease-in-out 2; }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.25); }
  }
  .xp-info { flex: 1; }
  .xp-bar-track {
    width: 100%; height: 10px; border-radius: 6px;
    background: var(--border); overflow: hidden; margin-top: 6px;
  }
  .xp-bar-fill { height: 100%; background: var(--accent); border-radius: 6px; transition: width .3s ease; }

  .banner {
    background: var(--accent-light);
    color: var(--accent);
    border-radius: 14px;
    padding: 14px 16px;
    font-weight: 600;
    border: 1px solid var(--accent);
  }
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 6px 12px;
    border-radius: 999px;
    background: var(--accent-light);
    color: var(--accent);
    font-size: 13px;
    font-weight: 600;
    margin: 3px;
  }

  /* Bottom nav */
  .bottom-nav {
    position: sticky;
    bottom: 0;
    display: flex;
    background: var(--bg2);
    border-top: 1px solid var(--border);
  }
  .nav-btn {
    flex: 1;
    background: none;
    border: none;
    color: var(--text2);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 10px 4px;
    min-height: 56px;
    font-size: 12px;
  }
  .nav-btn.active { color: var(--accent); font-weight: 700; }
  .nav-btn .icon { font-size: 20px; }

  /* Camera */
  .camera-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 4/3;
    border-radius: 16px;
    overflow: hidden;
    background: #000;
  }
  .camera-wrap video {
    width: 100%; height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
  }
  .camera-wrap canvas {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    transform: scaleX(-1);
  }
  .camera-overlay-msg {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.55);
    color: #fff;
    text-align: center;
    font-weight: 600;
    padding: 20px;
  }

  .rep-counter {
    text-align: center;
    font-size: clamp(96px, 25vw, 160px);
    font-weight: 800;
    line-height: 1;
    color: var(--accent);
  }
  .set-timer { text-align: center; font-size: 20px; color: var(--text2); }
  .header-strip {
    display: flex; justify-content: space-between; align-items: center;
    font-weight: 600;
  }

  /* Progress ring */
  .ring-wrap { position: relative; width: 160px; height: 160px; margin: 0 auto; }
  .ring-wrap svg { transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: var(--border); stroke-width: 10; }
  .ring-fg { fill: none; stroke: var(--accent); stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset .2s linear; }
  .ring-text {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 36px; font-weight: 800;
  }

  /* Stepper */
  .stepper { display: flex; gap: 8px; justify-content: center; }
  .step-dot {
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700;
    background: var(--bg2); color: var(--text2);
    border: 1px solid var(--border);
  }
  .step-dot.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .step-dot.done { background: var(--success); color: #fff; border-color: var(--success); }

  .center-col {
    display: flex; flex-direction: column; align-items: center;
    text-align: center; gap: 16px;
    flex: 1; justify-content: center;
  }

  .history-date-row {
    display: flex; justify-content: space-between; align-items: center;
    cursor: pointer;
    padding: 4px 0;
  }
  .history-set-row {
    display: flex; justify-content: space-between;
    padding: 8px 0; border-top: 1px solid var(--border);
    font-size: 14px;
  }

  .top-set-card {
    display: flex; justify-content: space-between; align-items: center;
  }

  canvas#progress-chart { width: 100% !important; max-height: 260px; }

  .muted-note { font-size: 13px; color: var(--text2); text-align: center; }
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js" onerror="window.__chartLoadFailed = true"></script>
<script type="module">
import { PoseLandmarker, FilesetResolver, DrawingUtils }
  from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';

/* ----------------------------------------------------------------------- */
/* Constants                                                                */
/* ----------------------------------------------------------------------- */
const DB_NAME = 'pullup-tracker';
const DB_VERSION = 1;
const STORES = ['calibration', 'sessions', 'prs', 'xp'];
const ALPHA = 0.3;
const MIN_REP_INTERVAL_MS = 600;
const REST_DEFAULT_SEC = 90;
const LANDMARK_LOST_TIMEOUT_MS = 2000;
const NO_LANDMARKS_FAIL_MS = 5000;

const POSE_CONNECTIONS = [
  [11,12],[11,13],[13,15],[12,14],[14,16],
  [11,23],[12,24],[23,24],
  [23,25],[25,27],[27,29],[29,31],[27,31],
  [24,26],[26,28],[28,30],[30,32],[28,32],
  [15,17],[15,19],[15,21],[17,19],
  [16,18],[16,20],[16,22],[18,20],
  [9,10],[0,1],[1,2],[2,3],[3,7],[0,4],[4,5],[5,6],[6,8]
];

/* ----------------------------------------------------------------------- */
/* Persistence layer (IndexedDB with localStorage fallback)                 */
/* ----------------------------------------------------------------------- */
let db = null;
let useLocalStorage = false;

function openDatabase() {
  return new Promise((resolve) => {
    if (!('indexedDB' in window)) {
      console.warn('IndexedDB unavailable — falling back to localStorage');
      useLocalStorage = true;
      resolve(null);
      return;
    }
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const d = req.result;
      if (!d.objectStoreNames.contains('calibration')) d.createObjectStore('calibration', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('sessions')) {
        const s = d.createObjectStore('sessions', { keyPath: 'id' });
        s.createIndex('date', 'date', { unique: false });
      }
      if (!d.objectStoreNames.contains('prs')) d.createObjectStore('prs', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('xp')) d.createObjectStore('xp', { keyPath: 'id' });
    };
    req.onsuccess = () => { db = req.result; resolve(db); };
    req.onerror = () => {
      console.warn('IndexedDB open failed — falling back to localStorage', req.error);
      useLocalStorage = true;
      resolve(null);
    };
  });
}

function lsKey(store) { return `pullup-tracker:${store}`; }

function lsReadAll(store) {
  try {
    const raw = localStorage.getItem(lsKey(store));
    return raw ? JSON.parse(raw) : [];
  } catch { return []; }
}
function lsWriteAll(store, arr) {
  localStorage.setItem(lsKey(store), JSON.stringify(arr));
}

function dbGet(store, key) {
  if (useLocalStorage || !db) {
    const all = lsReadAll(store);
    return Promise.resolve(all.find(r => r.id === key) || null);
  }
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).get(key);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}

function dbPut(store, value) {
  if (useLocalStorage || !db) {
    const all = lsReadAll(store);
    const idx = all.findIndex(r => r.id === value.id);
    if (idx >= 0) all[idx] = value; else all.push(value);
    lsWriteAll(store, all);
    return Promise.resolve();
  }
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).put(value);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

function dbGetAll(store) {
  if (useLocalStorage || !db) {
    return Promise.resolve(lsReadAll(store));
  }
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}

/* ----------------------------------------------------------------------- */
/* Utilities                                                                 */
/* ----------------------------------------------------------------------- */
function todayStr(d = new Date()) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function fmtDateLabel(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
}
function fmtSeconds(sec) {
  const s = Math.round(sec);
  const m = Math.floor(s / 60);
  const r = s % 60;
  return m > 0 ? `${m}:${String(r).padStart(2, '0')}` : `${r}s`;
}
function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ----------------------------------------------------------------------- */
/* App state                                                                 */
/* ----------------------------------------------------------------------- */
const state = {
  currentScreen: 'loading',
  calibration: null,
  xp: { id: 'default', totalXP: 0, level: 1 },
  prs: { id: 'default', bestSet: 0, bestDay: 0, bestSession: 0 },
  homeStats: { todayReps: 0, sessionsToday: 0 },
  recentPRs: null,        // array of broken PR labels from last saved session, shown once on Home
  lastLevelUp: false,
  cameraError: null,
  calib: null,            // calibration wizard runtime state
  workout: null,          // active workout runtime state
  rest: null,             // rest screen runtime state
  summary: null,          // session summary runtime state
  historyOpen: {},        // map of date -> expanded boolean
};

let videoEl = null;
let canvasEl = null;
let cameraStream = null;
let poseLandmarker = null;
let rafId = null;

/* ----------------------------------------------------------------------- */
/* MediaPipe setup                                                          */
/* ----------------------------------------------------------------------- */
async function ensurePoseLandmarker() {
  if (poseLandmarker) return poseLandmarker;
  const vision = await FilesetResolver.forVisionTasks(
    'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'
  );
  poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',
      delegate: 'GPU'
    },
    runningMode: 'VIDEO',
    numPoses: 1,
    minPoseDetectionConfidence: 0.5,
    minPosePresenceConfidence: 0.5,
    minTrackingConfidence: 0.5
  });
  return poseLandmarker;
}

async function startCamera(video) {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }
  });
  video.srcObject = stream;
  await video.play();
  return stream;
}

function stopCamera() {
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  if (cameraStream) {
    cameraStream.getTracks().forEach(t => t.stop());
    cameraStream = null;
  }
}

/* ----------------------------------------------------------------------- */
/* Rep counting state machine                                               */
/* ----------------------------------------------------------------------- */
class RepCounter {
  constructor(calibration) {
    this.baseline_y = calibration.baseline_y;
    this.up_y = calibration.up_y;
    this.range = calibration.range;
    this.ascend_threshold = this.baseline_y - 0.20 * this.range;
    this.up_threshold = this.up_y + 0.10 * this.range;
    this.descend_threshold = this.baseline_y - 0.08 * this.range;
    this.reset();
  }
  reset() {
    this.state = 'HANGING';
    this.smoothed_y = null;
    this.prevSmoothed = null;
    this.increasingFrames = 0;
    this.pendingState = null;
    this.pendingFrames = 0;
    this.lastRepTime = 0;
    this.reps = 0;
    this.repTimestamps = [];
  }
  _want(target, conditionMet, timestamp, sessionStartMs) {
    if (!conditionMet) { this.pendingState = null; this.pendingFrames = 0; return; }
    if (this.pendingState === target) this.pendingFrames++;
    else { this.pendingState = target; this.pendingFrames = 1; }
    if (this.pendingFrames >= 3) {
      this._enter(target, timestamp, sessionStartMs);
      this.pendingState = null;
      this.pendingFrames = 0;
    }
  }
  _enter(target, timestamp, sessionStartMs) {
    if (target === 'HANGING' && this.state === 'DESCENDING') {
      if (timestamp - this.lastRepTime >= MIN_REP_INTERVAL_MS) {
        this.reps++;
        this.lastRepTime = timestamp;
        this.repTimestamps.push(Math.max(0, Math.round(timestamp - sessionStartMs)));
        this._repCounted = true;
      }
    }
    if (target === 'UP') this.increasingFrames = 0;
    this.state = target;
  }
  update(landmarks, timestamp, sessionStartMs) {
    this._repCounted = false;
    const ls = landmarks[11], rs = landmarks[12], nose = landmarks[0];
    if (!ls || !rs) return { repCounted: false, state: this.state, smoothed_y: this.smoothed_y };
    const raw_y = (ls.y + rs.y) / 2;
    this.prevSmoothed = this.smoothed_y;
    this.smoothed_y = (this.smoothed_y == null) ? raw_y : (ALPHA * raw_y + (1 - ALPHA) * this.smoothed_y);

    switch (this.state) {
      case 'HANGING':
        this._want('ASCENDING', this.smoothed_y < this.ascend_threshold, timestamp, sessionStartMs);
        break;
      case 'ASCENDING': {
        const occluded = !!(nose && typeof nose.visibility === 'number' && nose.visibility < 0.4);
        this._want('UP', this.smoothed_y < this.up_threshold || occluded, timestamp, sessionStartMs);
        break;
      }
      case 'UP':
        if (this.prevSmoothed != null && this.smoothed_y > this.prevSmoothed) this.increasingFrames++;
        else this.increasingFrames = 0;
        if (this.increasingFrames >= 3) {
          this._enter('DESCENDING', timestamp, sessionStartMs);
          this.increasingFrames = 0;
        }
        break;
      case 'DESCENDING':
        this._want('HANGING', this.smoothed_y > this.descend_threshold, timestamp, sessionStartMs);
        break;
    }
    return { repCounted: this._repCounted, state: this.state, smoothed_y: this.smoothed_y };
  }
}

/* ----------------------------------------------------------------------- */
/* Skeleton drawing                                                          */
/* ----------------------------------------------------------------------- */
function drawSkeleton(ctx, landmarks, w, h) {
  ctx.clearRect(0, 0, w, h);
  ctx.strokeStyle = '#22d3ee';
  ctx.lineWidth = 1.5;
  ctx.fillStyle = '#22d3ee';
  for (const [a, b] of POSE_CONNECTIONS) {
    const la = landmarks[a], lb = landmarks[b];
    if (!la || !lb) continue;
    if ((la.visibility ?? 1) <= 0.5 || (lb.visibility ?? 1) <= 0.5) continue;
    ctx.beginPath();
    ctx.moveTo(la.x * w, la.y * h);
    ctx.lineTo(lb.x * w, lb.y * h);
    ctx.stroke();
  }
  for (const lm of landmarks) {
    if ((lm.visibility ?? 1) <= 0.5) continue;
    ctx.beginPath();
    ctx.arc(lm.x * w, lm.y * h, 3, 0, Math.PI * 2);
    ctx.fill();
  }
}

/* ----------------------------------------------------------------------- */
/* Router                                                                    */
/* ----------------------------------------------------------------------- */
function render() {
  const app = document.getElementById('app');
  switch (state.currentScreen) {
    case 'loading': app.innerHTML = renderLoading(); break;
    case 'cameraError': app.innerHTML = renderCameraError(); break;
    case 'home': app.innerHTML = renderHome(); attachHomeEvents(); break;
    case 'calibration': app.innerHTML = renderCalibration(); attachCalibrationEvents(); break;
    case 'workout': app.innerHTML = renderWorkout(); attachWorkoutEvents(); break;
    case 'rest': app.innerHTML = renderRest(); attachRestEvents(); break;
    case 'summary': app.innerHTML = renderSummary(); attachSummaryEvents(); break;
    case 'history': app.innerHTML = renderHistory(); attachHistoryEvents(); break;
    case 'stats': app.innerHTML = renderStats(); attachStatsEvents(); break;
    default: app.innerHTML = renderLoading();
  }
}

function bottomNav(active) {
  return `
    <nav class="bottom-nav">
      <button class="nav-btn ${active === 'home' ? 'active' : ''}" data-nav="home"><span class="icon">🏠</span>Home</button>
      <button class="nav-btn ${active === 'stats' ? 'active' : ''}" data-nav="stats"><span class="icon">📈</span>Stats</button>
      <button class="nav-btn ${active === 'history' ? 'active' : ''}" data-nav="history"><span class="icon">🗓️</span>History</button>
    </nav>`;
}

function attachNavEvents(root) {
  root.querySelectorAll('[data-nav]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const target = btn.dataset.nav;
      stopCamera();
      if (target === 'home') { await goHome(); return; }
      if (target === 'history') { await loadHistory(); state.currentScreen = 'history'; render(); return; }
      if (target === 'stats') { await loadStats(); state.currentScreen = 'stats'; render(); return; }
    });
  });
}

/* ----------------------------------------------------------------------- */
/* Loading / camera error screens                                           */
/* ----------------------------------------------------------------------- */
function renderLoading() {
  return `<div class="screen center-col"><h2>Loading…</h2></div>`;
}

function renderCameraError() {
  return `
    <div class="screen center-col">
      <h2>Camera access needed</h2>
      <p>Pull-up Tracker needs your camera to count reps. Please allow camera access in your browser settings, then try again.</p>
      <p class="muted-note">On most phones: open browser settings → Site settings → Camera → Allow for this site.</p>
      <button class="btn" id="retry-camera">Try again</button>
    </div>`;
}

/* ----------------------------------------------------------------------- */
/* Screen 1: Home                                                           */
/* ----------------------------------------------------------------------- */
function renderHome() {
  const { totalXP, level } = state.xp;
  const xpInLevel = totalXP % 50;
  const pct = Math.min(100, (xpInLevel / 50) * 100);
  const prBanner = state.recentPRs && state.recentPRs.length
    ? `<div class="banner">🏆 New PR — ${escapeHtml(state.recentPRs.join(', '))}</div>`
    : '';
  return `
    <div class="screen">
      <div class="card xp-block">
        <div class="level-badge ${state.lastLevelUp ? 'pulse' : ''}">${level}</div>
        <div class="xp-info">
          <div><strong>Level ${level}</strong></div>
          <div class="xp-bar-track"><div class="xp-bar-fill" style="width:${pct}%"></div></div>
          <div class="muted-note">${50 - xpInLevel} XP to next level</div>
        </div>
      </div>
      <div class="row">
        <div class="tile"><div class="value">${state.homeStats.todayReps}</div><div class="label">Today's reps</div></div>
        <div class="tile"><div class="value">${state.homeStats.sessionsToday}</div><div class="label">Sessions today</div></div>
      </div>
      ${prBanner}
      <button class="btn btn-block" id="start-workout" style="min-height:64px;font-size:20px;">Start workout</button>
      ${bottomNav('home')}
    </div>`;
}

function attachHomeEvents() {
  const app = document.getElementById('app');
  attachNavEvents(app);
  app.querySelector('#start-workout').addEventListener('click', async () => {
    state.recentPRs = null;
    state.lastLevelUp = false;
    if (!state.calibration) {
      state.currentScreen = 'calibration';
      render();
    } else {
      await beginWorkoutFlow();
    }
  });
}

async function refreshHomeStats() {
  const sessions = await dbGetAll('sessions');
  const today = todayStr();
  const todays = sessions.filter(s => s.date === today);
  state.homeStats.todayReps = todays.reduce((sum, s) => sum + s.totalReps, 0);
  state.homeStats.sessionsToday = todays.length;
}

async function goHome() {
  await refreshHomeStats();
  state.currentScreen = 'home';
  render();
}

/* ----------------------------------------------------------------------- */
/* Screen 2: Calibration wizard                                             */
/* ----------------------------------------------------------------------- */
function newCalibState() {
  return {
    step: 1,
    countdown: 3,
    sampling: false,
    samples: [],
    detecting: false,
    minY: null,
    detectStartTime: null,
    lastLandmarkTime: null,
    noLandmarkSince: null,
    failed: false,
    result: null,
    statusText: '',
  };
}

function renderCalibration() {
  const c = state.calib;
  const stepDots = [1, 2, 3].map(n => {
    const cls = n < c.step ? 'done' : (n === c.step ? 'active' : '');
    return `<div class="step-dot ${cls}">${n < c.step ? '✓' : n}</div>`;
  }).join('');

  let body = '';
  if (c.step === 1) {
    body = `
      <h2>Set up your phone</h2>
      <p>Position your phone so your full body from wrists to hips is visible — prop it in the sink or on a shelf, facing you.</p>
      <button class="btn btn-block" id="calib-ready">I'm ready</button>`;
  } else if (c.step === 2) {
    body = `
      <h2>Hang from the bar</h2>
      <p>Jump up and hang still. We'll sample your position.</p>
      <div class="camera-wrap">
        <video playsinline muted></video>
        <canvas></canvas>
        ${c.failed ? `<div class="camera-overlay-msg">Can't detect your body — check lighting and camera angle. <br>Try again.</div>` : ''}
      </div>
      <div class="ring-wrap">
        ${ringSvg(c.sampling ? (c.samples.length / 30) : ((3 - c.countdown) / 3))}
        <div class="ring-text">${c.sampling ? c.samples.length + '/30' : c.countdown}</div>
      </div>
      <p class="muted-note">${escapeHtml(c.statusText || (c.sampling ? 'Sampling…' : 'Get ready…'))}</p>
      ${c.failed ? `<button class="btn btn-block" id="calib-retry">Try again</button>` : ''}`;
  } else if (c.step === 3 && !c.result) {
    body = `
      <h2>One full slow pull-up</h2>
      <p>Now do one full, slow pull-up — all the way up, all the way down.</p>
      <div class="camera-wrap">
        <video playsinline muted></video>
        <canvas></canvas>
        ${c.failed ? `<div class="camera-overlay-msg">Can't detect your body — check lighting and camera angle. <br>Try again.</div>` : ''}
      </div>
      <p class="muted-note">${escapeHtml(c.statusText || 'Detecting…')}</p>
      ${c.failed ? `<button class="btn btn-block" id="calib-retry">Try again</button>` : ''}`;
  } else if (c.step === 3 && c.result) {
    const r = c.result;
    body = `
      <h2>Got it ✓</h2>
      <div class="card">
        <p>Hang baseline (baseline_y): <strong>${r.baseline_y.toFixed(3)}</strong></p>
        <p>Top position (up_y): <strong>${r.up_y.toFixed(3)}</strong></p>
        <p>Range: <strong>${r.range.toFixed(3)}</strong></p>
      </div>
      <button class="btn btn-block" id="calib-save">Save & start workout</button>
      <button class="btn btn-block btn-secondary" id="calib-recalibrate">Recalibrate</button>`;
  }

  return `
    <div class="screen">
      <div class="stepper">${stepDots}</div>
      ${body}
    </div>`;
}

function ringSvg(progress) {
  const r = 70, c = 2 * Math.PI * r;
  const offset = c * (1 - Math.max(0, Math.min(1, progress)));
  return `
    <svg width="160" height="160" viewBox="0 0 160 160">
      <circle class="ring-bg" cx="80" cy="80" r="${r}"></circle>
      <circle class="ring-fg" cx="80" cy="80" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${offset}"></circle>
    </svg>`;
}

function attachCalibrationEvents() {
  const app = document.getElementById('app');
  const c = state.calib;

  if (c.step === 1) {
    app.querySelector('#calib-ready').addEventListener('click', () => startCalibrationStep2());
    return;
  }

  const retry = app.querySelector('#calib-retry');
  if (retry) retry.addEventListener('click', () => {
    if (c.step === 2) startCalibrationStep2();
    else startCalibrationStep3();
  });

  if (c.step === 3 && c.result) {
    app.querySelector('#calib-save').addEventListener('click', async () => {
      await saveCalibration(c.result);
      stopCamera();
      await beginWorkoutFlow();
    });
    app.querySelector('#calib-recalibrate').addEventListener('click', () => {
      stopCamera();
      state.calib = newCalibState();
      render();
    });
    return;
  }

  // Steps 2 & 3 need live camera + detection (unless we're showing the "failed, retry" state)
  if (c.failed) return;
  videoEl = app.querySelector('video');
  canvasEl = app.querySelector('canvas');
  setupCalibCamera();
}

async function setupCalibCamera() {
  try {
    cameraStream = await startCamera(videoEl);
    await ensurePoseLandmarker();
    state.calib.lastLandmarkTime = performance.now();
    state.calib.noLandmarkSince = null;
    state.calib.detectStartTime = performance.now();
    runCalibLoop();
  } catch (err) {
    console.error(err);
    state.cameraError = err;
    state.currentScreen = 'cameraError';
    render();
  }
}

function startCalibrationStep2() {
  stopCamera();
  state.calib.step = 2;
  state.calib.countdown = 3;
  state.calib.sampling = false;
  state.calib.samples = [];
  state.calib.failed = false;
  state.calib.statusText = '';
  state.calib.result = null;
  render();

  let remaining = 3;
  const tick = () => {
    state.calib.countdown = remaining;
    const ring = document.querySelector('.ring-text');
    if (ring) ring.textContent = remaining;
    const fg = document.querySelector('.ring-fg');
    if (fg) {
      const r = 70, cFull = 2 * Math.PI * r;
      fg.setAttribute('stroke-dashoffset', cFull * (1 - (3 - remaining) / 3));
    }
    if (remaining <= 0) {
      state.calib.sampling = true;
      const status = document.querySelector('.muted-note');
      if (status) status.textContent = 'Sampling…';
      if (ring) ring.textContent = `0/30`;
      return;
    }
    remaining--;
    setTimeout(tick, 1000);
  };
  setTimeout(tick, 1000);
}

function startCalibrationStep3() {
  stopCamera();
  state.calib.step = 3;
  state.calib.minY = null;
  state.calib.failed = false;
  state.calib.statusText = '';
  state.calib.result = null;
  state.calib.detecting = true;
  render();
}

function runCalibLoop() {
  const loop = (ts) => {
    if (!cameraStream || !videoEl || videoEl.readyState < 2) {
      rafId = requestAnimationFrame(loop);
      return;
    }
    if (canvasEl.width !== videoEl.videoWidth && videoEl.videoWidth) {
      canvasEl.width = videoEl.videoWidth;
      canvasEl.height = videoEl.videoHeight;
    }
    const result = poseLandmarker.detectForVideo(videoEl, performance.now());
    const ctx = canvasEl.getContext('2d');
    const now = performance.now();

    if (result.landmarks && result.landmarks.length > 0) {
      const lm = result.landmarks[0];
      drawSkeleton(ctx, lm, canvasEl.width, canvasEl.height);
      state.calib.lastLandmarkTime = now;
      state.calib.noLandmarkSince = null;
      processCalibFrame(lm, now);
    } else {
      ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);
      if (state.calib.noLandmarkSince == null) state.calib.noLandmarkSince = now;
      if (now - state.calib.noLandmarkSince > NO_LANDMARKS_FAIL_MS) {
        failCalibration();
        return;
      }
    }
    rafId = requestAnimationFrame(loop);
  };
  rafId = requestAnimationFrame(loop);
}

function failCalibration() {
  stopCamera();
  state.calib.failed = true;
  render();
}

function processCalibFrame(landmarks, now) {
  const c = state.calib;
  const ls = landmarks[11], rs = landmarks[12];
  if (!ls || !rs) return;
  const avgY = (ls.y + rs.y) / 2;

  if (c.step === 2) {
    if (!c.sampling) return;
    c.samples.push(avgY);
    const status = document.querySelector('.muted-note');
    const ringText = document.querySelector('.ring-text');
    if (ringText) ringText.textContent = `${c.samples.length}/30`;
    const fg = document.querySelector('.ring-fg');
    if (fg) {
      const r = 70, cFull = 2 * Math.PI * r;
      fg.setAttribute('stroke-dashoffset', cFull * (1 - c.samples.length / 30));
    }
    if (c.samples.length >= 30) {
      const baseline_y = c.samples.reduce((a, b) => a + b, 0) / c.samples.length;
      c.baseline_y = baseline_y;
      c.statusText = 'Got it ✓';
      stopCamera();
      setTimeout(() => startCalibrationStep3(), 800);
    }
  } else if (c.step === 3) {
    if (!c.detecting) return;
    if (c.minY == null) c.minY = avgY;
    else c.minY = Math.min(c.minY, avgY);

    // simplified detection: shoulder Y dropped by > 15% of frame height (normalized => 0.15)
    const drop = c.baseline_y - c.minY;
    const status = document.querySelector('.muted-note');
    if (drop > 0.15) {
      c.detecting = false;
      const up_y = c.minY;
      const range = c.baseline_y - up_y;
      c.result = { baseline_y: c.baseline_y, up_y, range, createdAt: new Date().toISOString() };
      stopCamera();
      render();
    } else if (status) {
      status.textContent = `Detecting… (${Math.round(drop * 100)}% of the way)`;
    }
  }
}

async function saveCalibration(result) {
  const record = { id: 'default', ...result };
  await dbPut('calibration', record);
  state.calibration = record;
}

/* ----------------------------------------------------------------------- */
/* Workout flow helpers                                                     */
/* ----------------------------------------------------------------------- */
async function beginWorkoutFlow() {
  // re-check calibration
  if (!state.calibration) {
    const cal = await dbGet('calibration', 'default');
    state.calibration = cal;
  }
  if (!state.calibration) {
    state.calib = newCalibState();
    state.currentScreen = 'calibration';
    render();
    return;
  }
  await refreshHomeStats();
  state.workout = {
    sessionStart: new Date(),
    sessionStartMs: performance.now(),
    sets: [],
    setNumber: 1,
    setStartTime: null,
    setStartMs: null,
    counter: null,
    landmarksLostSince: null,
    showStepIntoFrame: false,
    timerInterval: null,
    elapsedSec: 0,
  };
  state.currentScreen = 'workout';
  render();
  await setupWorkoutCamera();
  startNewSet();
}

function startNewSet() {
  const w = state.workout;
  w.counter = new RepCounter(state.calibration);
  w.setStartTime = new Date();
  w.setStartMs = performance.now();
  w.elapsedSec = 0;
  if (w.timerInterval) clearInterval(w.timerInterval);
  w.timerInterval = setInterval(() => {
    w.elapsedSec = (performance.now() - w.setStartMs) / 1000;
    updateWorkoutTimerDisplay();
  }, 250);
  updateWorkoutDisplay();
}

function updateWorkoutTimerDisplay() {
  const el = document.querySelector('.set-timer');
  if (el) el.textContent = fmtSeconds(state.workout.elapsedSec);
}

function updateWorkoutDisplay() {
  const w = state.workout;
  if (!w) return;
  const repEl = document.querySelector('.rep-counter');
  if (repEl) repEl.textContent = w.counter.reps;
  const headerLeft = document.querySelector('[data-set-label]');
  if (headerLeft) headerLeft.textContent = `Set ${w.setNumber}`;
  const totalEl = document.querySelector('[data-total-today]');
  const priorTotal = w.sets.reduce((s, st) => s + st.reps, 0);
  if (totalEl) totalEl.textContent = `Total today: ${state.homeStats.todayReps + priorTotal + w.counter.reps}`;
  const endBtn = document.querySelector('#end-set');
  if (endBtn) endBtn.style.display = w.counter.reps >= 1 ? 'inline-flex' : 'none';
}

/* ----------------------------------------------------------------------- */
/* Screen 3: Workout                                                        */
/* ----------------------------------------------------------------------- */
function renderWorkout() {
  const w = state.workout;
  const priorTotal = w ? w.sets.reduce((s, st) => s + st.reps, 0) : 0;
  const totalToday = state.homeStats.todayReps + priorTotal + (w?.counter?.reps || 0);
  return `
    <div class="screen">
      <div class="header-strip">
        <span data-set-label>Set ${w?.setNumber || 1}</span>
        <span data-total-today>Total today: ${totalToday}</span>
      </div>
      <div class="camera-wrap">
        <video playsinline muted></video>
        <canvas></canvas>
        <div class="camera-overlay-msg" style="display:none;" data-step-into-frame>Step into frame</div>
      </div>
      <div class="rep-counter">${w?.counter?.reps || 0}</div>
      <div class="set-timer">0:00</div>
      <button class="btn btn-block" id="end-set" style="display:none;">End set</button>
    </div>`;
}

function attachWorkoutEvents() {
  const app = document.getElementById('app');
  videoEl = app.querySelector('video');
  canvasEl = app.querySelector('canvas');
  app.querySelector('#end-set').addEventListener('click', () => endCurrentSet());
}

async function setupWorkoutCamera() {
  try {
    cameraStream = await startCamera(videoEl);
    await ensurePoseLandmarker();
    runWorkoutLoop();
  } catch (err) {
    console.error(err);
    state.cameraError = err;
    state.currentScreen = 'cameraError';
    render();
  }
}

function runWorkoutLoop() {
  const loop = () => {
    const w = state.workout;
    if (!w || state.currentScreen !== 'workout') return;
    if (!videoEl || videoEl.readyState < 2) { rafId = requestAnimationFrame(loop); return; }
    if (canvasEl.width !== videoEl.videoWidth && videoEl.videoWidth) {
      canvasEl.width = videoEl.videoWidth;
      canvasEl.height = videoEl.videoHeight;
    }
    const now = performance.now();
    const result = poseLandmarker.detectForVideo(videoEl, now);
    const ctx = canvasEl.getContext('2d');
    const overlay = document.querySelector('[data-step-into-frame]');

    if (result.landmarks && result.landmarks.length > 0) {
      const lm = result.landmarks[0];
      drawSkeleton(ctx, lm, canvasEl.width, canvasEl.height);
      w.landmarksLostSince = null;
      if (overlay) overlay.style.display = 'none';
      const out = w.counter.update(lm, now, w.setStartMs);
      if (out.repCounted) updateWorkoutDisplay();
    } else {
      ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);
      if (w.landmarksLostSince == null) w.landmarksLostSince = now;
      if (now - w.landmarksLostSince > LANDMARK_LOST_TIMEOUT_MS) {
        if (overlay) overlay.style.display = 'flex';
      }
    }
    rafId = requestAnimationFrame(loop);
  };
  rafId = requestAnimationFrame(loop);
}

function endCurrentSet() {
  const w = state.workout;
  if (!w || w.counter.reps < 1) return;
  if (w.timerInterval) { clearInterval(w.timerInterval); w.timerInterval = null; }

  const reps = w.counter.reps;
  const repTimestamps = w.counter.repTimestamps.slice();
  const durationSec = (performance.now() - w.setStartMs) / 1000;
  let avgPaceSec = 0;
  if (repTimestamps.length > 1) {
    const intervals = [];
    for (let i = 1; i < repTimestamps.length; i++) intervals.push((repTimestamps[i] - repTimestamps[i - 1]) / 1000);
    avgPaceSec = intervals.reduce((a, b) => a + b, 0) / intervals.length;
  } else {
    avgPaceSec = durationSec;
  }

  const setRecord = {
    setNumber: w.setNumber,
    reps,
    repTimestamps,
    durationSec: Math.round(durationSec * 10) / 10,
    avgPaceSec: Math.round(avgPaceSec * 10) / 10,
  };
  w.sets.push(setRecord);
  w.setNumber++;

  stopCamera();
  state.rest = {
    lastSet: setRecord,
    isPRSet: setRecord.reps > state.prs.bestSet,
    secondsLeft: REST_DEFAULT_SEC,
    interval: null,
  };
  state.currentScreen = 'rest';
  render();
}

/* ----------------------------------------------------------------------- */
/* Screen 4: Rest timer                                                     */
/* ----------------------------------------------------------------------- */
function renderRest() {
  const r = state.rest;
  const s = r.lastSet;
  const progress = r.secondsLeft / REST_DEFAULT_SEC;
  return `
    <div class="screen">
      <div class="card">
        <h3>Set ${s.setNumber}: ${s.reps} reps</h3>
        <p>Avg pace: ${s.avgPaceSec}s/rep · Duration: ${fmtSeconds(s.durationSec)}</p>
        ${r.isPRSet ? `<div class="badge">🏆 New best set!</div>` : ''}
      </div>
      <h2 style="text-align:center;">Rest</h2>
      <div class="ring-wrap">
        ${ringSvg(progress)}
        <div class="ring-text">${r.secondsLeft}</div>
      </div>
      <button class="btn btn-block" id="next-set">Skip rest / Next set</button>
      <button class="btn btn-block btn-secondary" id="end-session">End session</button>
    </div>`;
}

function attachRestEvents() {
  const app = document.getElementById('app');
  const r = state.rest;
  r.interval = setInterval(() => {
    r.secondsLeft--;
    if (r.secondsLeft <= 0) {
      clearInterval(r.interval);
      r.secondsLeft = 0;
    }
    const ringText = document.querySelector('.ring-text');
    if (ringText) ringText.textContent = r.secondsLeft;
    const fg = document.querySelector('.ring-fg');
    if (fg) {
      const radius = 70, c = 2 * Math.PI * radius;
      fg.setAttribute('stroke-dashoffset', c * (1 - r.secondsLeft / REST_DEFAULT_SEC));
    }
    if (r.secondsLeft <= 0) clearInterval(r.interval);
  }, 1000);

  app.querySelector('#next-set').addEventListener('click', async () => {
    clearInterval(r.interval);
    state.currentScreen = 'workout';
    render();
    await setupWorkoutCamera();
    startNewSet();
  });
  app.querySelector('#end-session').addEventListener('click', () => {
    clearInterval(r.interval);
    finishSession();
  });
}

/* ----------------------------------------------------------------------- */
/* Session finish / summary                                                 */
/* ----------------------------------------------------------------------- */
function finishSession() {
  const w = state.workout;
  const totalReps = w.sets.reduce((s, st) => s + st.reps, 0);
  if (totalReps === 0 || w.sets.length === 0) {
    state.workout = null;
    state.rest = null;
    goHome();
    return;
  }
  const topSets = w.sets.slice().sort((a, b) => b.reps - a.reps).slice(0, 3);
  const session = {
    id: crypto.randomUUID(),
    date: todayStr(w.sessionStart),
    startTime: w.sessionStart.toISOString(),
    endTime: new Date().toISOString(),
    sets: w.sets,
    totalReps,
    topSets,
  };
  state.summary = { session, saved: false, brokenPRs: [], xpEarned: totalReps, levelUp: false, prevLevel: state.xp.level };
  state.currentScreen = 'summary';
  render();
}

/* ----------------------------------------------------------------------- */
/* Screen 5: Session summary                                                */
/* ----------------------------------------------------------------------- */
function renderSummary() {
  const sm = state.summary;
  const session = sm.session;
  const durationSec = (new Date(session.endTime) - new Date(session.startTime)) / 1000;
  const topSetsHtml = session.topSets.map(s => `
    <div class="card top-set-card">
      <span><strong>Set ${s.setNumber}</strong> — ${s.reps} reps</span>
      <span class="muted-note">${s.avgPaceSec}s/rep · ${fmtSeconds(s.durationSec)}</span>
    </div>`).join('');
  const prBadges = sm.brokenPRs.map(p => `<span class="badge">🏆 ${escapeHtml(p)}</span>`).join('');
  return `
    <div class="screen">
      <h2>${fmtDateLabel(session.date)}</h2>
      <p>Total duration: ${fmtSeconds(durationSec)}</p>
      <h3>Top sets</h3>
      ${topSetsHtml || '<p>No sets recorded.</p>'}
      <div class="row">
        <div class="tile"><div class="value">${session.totalReps}</div><div class="label">Total reps</div></div>
        <div class="tile"><div class="value">${session.sets.length}</div><div class="label">Total sets</div></div>
      </div>
      ${prBadges ? `<div><h3>PRs achieved</h3>${prBadges}</div>` : ''}
      <div class="card" style="text-align:center;">
        <div class="level-badge ${sm.levelUp ? 'pulse' : ''}" style="margin: 0 auto;">${state.xp.level}</div>
        <h3 style="margin-top:8px;">+${sm.xpEarned} XP</h3>
        ${sm.levelUp ? `<p>Level up! 🎉</p>` : ''}
      </div>
      <button class="btn btn-block" id="save-go-home" ${sm.saved ? 'disabled' : ''}>${sm.saved ? 'Saved ✓' : 'Save & go home'}</button>
    </div>`;
}

function attachSummaryEvents() {
  const app = document.getElementById('app');
  app.querySelector('#save-go-home').addEventListener('click', async () => {
    await persistSession();
  });
}

async function persistSession() {
  const sm = state.summary;
  if (sm.saved) return;
  const session = sm.session;

  await dbPut('sessions', session);

  // XP
  const prevLevel = state.xp.level;
  state.xp.totalXP += session.totalReps;
  state.xp.level = Math.floor(state.xp.totalXP / 50) + 1;
  await dbPut('xp', state.xp);
  sm.levelUp = state.xp.level > prevLevel;
  state.lastLevelUp = sm.levelUp;

  // PRs
  const broken = await checkAndUpdatePRs(session);
  sm.brokenPRs = broken;
  state.recentPRs = broken.length ? broken : null;

  sm.saved = true;
  render();
  setTimeout(async () => {
    state.workout = null;
    state.rest = null;
    state.summary = null;
    await goHome();
  }, 900);
}

async function checkAndUpdatePRs(session) {
  const broken = [];
  let prs = await dbGet('prs', 'default');
  if (!prs) prs = { id: 'default', bestSet: 0, bestDay: 0, bestSession: 0 };

  const bestOfSession = session.topSets[0]?.reps || 0;
  if (bestOfSession > prs.bestSet) {
    prs.bestSet = bestOfSession;
    broken.push('Best set');
  }

  const allSessions = await dbGetAll('sessions');
  const todayTotal = allSessions
    .filter(s => s.date === session.date)
    .reduce((sum, s) => sum + s.totalReps, 0);
  if (todayTotal > prs.bestDay) {
    prs.bestDay = todayTotal;
    broken.push('Best day');
  }

  if (session.totalReps > prs.bestSession) {
    prs.bestSession = session.totalReps;
    broken.push('Best session');
  }

  await dbPut('prs', prs);
  state.prs = prs;
  return broken;
}

/* ----------------------------------------------------------------------- */
/* Screen 6: History                                                        */
/* ----------------------------------------------------------------------- */
function renderHistory() {
  const groups = state._historyGroups || [];
  const rows = groups.map(g => {
    const expanded = !!state.historyOpen[g.date];
    const setsHtml = expanded ? g.sessions.flatMap(s => s.sets).map(set => `
      <div class="history-set-row">
        <span>Set ${set.setNumber}</span>
        <span>${set.reps} reps</span>
        <span class="muted-note">${set.avgPaceSec}s/rep</span>
      </div>`).join('') : '';
    return `
      <div class="card">
        <div class="history-date-row" data-date="${g.date}">
          <span><strong>${fmtDateLabel(g.date)}</strong></span>
          <span class="muted-note">${g.totalReps} reps · ${g.setCount} sets ${expanded ? '▲' : '▼'}</span>
        </div>
        ${setsHtml}
      </div>`;
  }).join('');

  return `
    <div class="screen">
      <h2>History</h2>
      ${rows || '<p>No sessions yet. Start your first workout!</p>'}
      ${bottomNav('history')}
    </div>`;
}

function attachHistoryEvents() {
  const app = document.getElementById('app');
  attachNavEvents(app);
  app.querySelectorAll('[data-date]').forEach(el => {
    el.addEventListener('click', () => {
      const d = el.dataset.date;
      state.historyOpen[d] = !state.historyOpen[d];
      render();
    });
  });
}

async function loadHistory() {
  const sessions = await dbGetAll('sessions');
  sessions.sort((a, b) => b.date.localeCompare(a.date) || (b.startTime || '').localeCompare(a.startTime || ''));
  const byDate = new Map();
  for (const s of sessions) {
    if (!byDate.has(s.date)) byDate.set(s.date, { date: s.date, sessions: [], totalReps: 0, setCount: 0 });
    const g = byDate.get(s.date);
    g.sessions.push(s);
    g.totalReps += s.totalReps;
    g.setCount += s.sets.length;
  }
  state._historyGroups = Array.from(byDate.values());
}

/* ----------------------------------------------------------------------- */
/* Screen 7: Stats / Progress                                               */
/* ----------------------------------------------------------------------- */
let progressChart = null;

function renderStats() {
  const v = state._statsVolume || { allTime: 0, weeklyAvg: 0, bestDay: 0, bestSet: 0 };
  const chartAvailable = typeof window.Chart !== 'undefined';
  return `
    <div class="screen">
      <h2>Progress</h2>
      <div class="row">
        <div class="tile"><div class="value">${v.allTime}</div><div class="label">All-time reps</div></div>
        <div class="tile"><div class="value">${v.weeklyAvg}</div><div class="label">Weekly avg</div></div>
      </div>
      <div class="row">
        <div class="tile"><div class="value">${v.bestDay}</div><div class="label">Best day</div></div>
        <div class="tile"><div class="value">${v.bestSet}</div><div class="label">Best set ever</div></div>
      </div>
      <div class="card">
        <h3>Last 30 days</h3>
        ${chartAvailable
          ? `<canvas id="progress-chart" height="200"></canvas>`
          : `<p>Chart unavailable — check your connection.</p>`}
      </div>
      <button class="btn btn-block btn-secondary" id="export-data">Export all data (JSON)</button>
      ${bottomNav('stats')}
    </div>`;
}

function attachStatsEvents() {
  const app = document.getElementById('app');
  attachNavEvents(app);
  app.querySelector('#export-data').addEventListener('click', exportAllData);

  if (typeof window.Chart !== 'undefined') {
    const canvas = document.getElementById('progress-chart');
    if (canvas) buildProgressChart(canvas);
  }
}

async function loadStats() {
  const sessions = await dbGetAll('sessions');
  const allTime = sessions.reduce((sum, s) => sum + s.totalReps, 0);

  const byDate = new Map();
  for (const s of sessions) byDate.set(s.date, (byDate.get(s.date) || 0) + s.totalReps);

  const bestDay = Math.max(0, ...Array.from(byDate.values()));
  const bestSet = sessions.reduce((max, s) => {
    const sMax = s.sets.reduce((m, st) => Math.max(m, st.reps), 0);
    return Math.max(max, sMax);
  }, 0);

  // weekly avg: average of daily totals over the last 7 days that have data, else last 7 calendar days
  const now = new Date();
  let weekSum = 0, weekDays = 0;
  for (let i = 0; i < 7; i++) {
    const d = new Date(now);
    d.setDate(d.getDate() - i);
    const ds = todayStr(d);
    weekSum += byDate.get(ds) || 0;
    weekDays++;
  }
  const weeklyAvg = weekDays ? Math.round((weekSum / weekDays) * 10) / 10 : 0;

  state._statsVolume = { allTime, weeklyAvg, bestDay, bestSet };

  // last 30 days chart data
  const labels = [];
  const data = [];
  for (let i = 29; i >= 0; i--) {
    const d = new Date(now);
    d.setDate(d.getDate() - i);
    const ds = todayStr(d);
    labels.push(ds.slice(5));
    data.push(byDate.get(ds) || 0);
  }
  state._chartData = { labels, data };
}

function buildProgressChart(canvas) {
  if (progressChart) { progressChart.destroy(); progressChart = null; }
  const { labels, data } = state._chartData || { labels: [], data: [] };
  const styles = getComputedStyle(document.documentElement);
  progressChart = new window.Chart(canvas.getContext('2d'), {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: 'Reps per day',
        data,
        borderColor: styles.getPropertyValue('--accent').trim() || '#4f46e5',
        backgroundColor: styles.getPropertyValue('--accent-light').trim() || '#e0e7ff',
        tension: 0.3,
        fill: true,
        pointRadius: 3,
      }]
    },
    options: {
      responsive: true,
      scales: {
        x: { ticks: { color: styles.getPropertyValue('--text2').trim() } },
        y: { beginAtZero: true, ticks: { color: styles.getPropertyValue('--text2').trim() } }
      },
      plugins: { legend: { display: false } }
    }
  });
}

async function exportAllData() {
  const [calibration, sessions, prs, xp] = await Promise.all([
    dbGet('calibration', 'default'),
    dbGetAll('sessions'),
    dbGet('prs', 'default'),
    dbGet('xp', 'default'),
  ]);
  const payload = { calibration, sessions, prs, xp, exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `pullup-data-${todayStr()}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

/* ----------------------------------------------------------------------- */
/* App init                                                                 */
/* ----------------------------------------------------------------------- */
async function init() {
  await openDatabase();

  const [calibration, prs, xp] = await Promise.all([
    dbGet('calibration', 'default'),
    dbGet('prs', 'default'),
    dbGet('xp', 'default'),
  ]);
  state.calibration = calibration || null;
  state.prs = prs || { id: 'default', bestSet: 0, bestDay: 0, bestSession: 0 };
  state.xp = xp || { id: 'default', totalXP: 0, level: 1 };

  await refreshHomeStats();

  if (!state.calibration) {
    state.calib = newCalibState();
    state.currentScreen = 'calibration';
  } else {
    state.currentScreen = 'home';
  }
  render();
}

document.querySelector('#app')?.addEventListener('click', (e) => {
  const retry = e.target.closest('#retry-camera');
  if (retry) {
    if (state.calib) { state.currentScreen = 'calibration'; }
    else { state.currentScreen = 'home'; }
    render();
  }
});

init();
</script>
</body>
</html>
